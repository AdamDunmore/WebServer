<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Server Panel</title>
		<link rel="stylesheet" href="/style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1">
	</head>
	<body>
        <box class="menu_box">
            <div class="header">
                <h3 id="header_title">Music Manager</h3>
            </div>
            <div id="content">
                <div id="media_container">
                    <select name="media_type" id="media_type">
                        <option value="album">Album</option>
                        <option value="track">Track</option>
                        <option value="artist">Artist</option>
                    </select>
                    <input id="media_name" placeholder="Enter a Qobuz Media Name"/>
                    <button id="media_confirm" onclick="search()">Search</button>
                </div>
                <div class="" id="search_results" />
            </div>
            <p class="hidden" id="status_label"></p>
        </box>
        <script>
            let input
            let status_label
            let search_results

            async function search_library(){
                search_results = document.getElementById("search_results");
                input = document.getElementById("media_name");
                const media_type = document.querySelector('input[name="media_type"]:checked')?.value;
                const res = await fetch(`/api/search_library`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        id: input.value,
                        media_type: media_type // TODO fix track media_type 
                    })
                });

                const json = await res.json();
                console.log(json)

                search_results.innerHTML = json.map(result => `<button class="media_result">${result.title}</button>`).join("\n")

            }

            async function search() {
                search_results = document.getElementById("search_results");
                input = document.getElementById("media_name");
                const media_type = document.getElementById("media_type").value;
                const media_confirm = document.getElementById("media_confirm");
                media_confirm.innerText = "Searching";
                const res = await fetch(`/api/search`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        id: input.value,
                        media_type: media_type 
                    })
                });

                const json = await res.json();

                media_confirm.innerText = "Done";
                search_results.innerHTML = json.map(result => `<button class="media_result" onclick="download_id('${result.id}', '${media_type}')">${result.desc}</button>`).join("\n")
            }

            async function download_id(id, media_type) {
                const media_confirm = document.getElementById("media_confirm");
                media_confirm.innerText = "Downloading";
                const res = await fetch(`/api/download_id`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        id: id,
                        media_type: media_type
                    })
                }); 
                if (await res.ok) {
                    media_confirm.innerText = "Complete";
                    input.value = "";
                    search_results.innerHTML = "";
                }
            }
        </script>
	</body>
</html>
