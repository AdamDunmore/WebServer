<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Server Panel Login</title>
		<link rel="stylesheet" href="/style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1">
	</head>
	<body>
        <div class="menu_box">
            <div id="login_container">
                <div id="login_box">
                    <h1>Login</h1>
                    <input id="password" placeholder="Password" type="password"/>
                    <button id="login_button" onclick="login()">Login</button>
                    <p class="hidden" id="incorrect_label">Incorrect Password</p>
                </div>
            </div>
        </div>
        <script>
            const input = document.getElementById("password")
            document.addEventListener("keypress", event => {
                if(event.key == "Enter"){
                    login();
                }
            })


            async function login(){
                const incorrect_label = document.getElementById("incorrect_label");
                const res = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        password: input.value.trim()
                    })
                });
                if (!(await res.ok)){
                    incorrect_label.classList = [];
                    setTimeout(() => incorrect_label.classList = [ "hidden" ], 3000)
                } else {
                    window.location.href = "/";
                }
            }
        </script>
	</body>
</html>
